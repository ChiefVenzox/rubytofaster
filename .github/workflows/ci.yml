name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-dogfood:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Run Minitest suite (warnings enabled)
        run: rake test

      - name: Self-hosted build & reproducibility check
        run: |
          VERSION=$(ruby -Ilib -rrubytofaster/version -e 'puts RubyToFaster::VERSION')
          ./gem.build.rb
          SHA1=$(ruby -rdigest -e "puts Digest::SHA256.file('pkg/rubytofaster-${VERSION}.gem').hexdigest")
          ./exe/rtf build --no-cache --out-dir pkg-verify
          SHA2=$(ruby -rdigest -e "puts Digest::SHA256.file('pkg-verify/rubytofaster-${VERSION}.gem').hexdigest")
          test "$SHA1" = "$SHA2"
          ./exe/rtf verify --reproducible
          ./exe/rtf inspect "pkg/rubytofaster-${VERSION}.gem"
          ./exe/rtf stats "pkg/rubytofaster-${VERSION}.gem"
          gem install --local "pkg/rubytofaster-${VERSION}.gem" --no-document
          rtf --version
